<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kazka</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div id="status-dot"></div>
    <span id="status-text">Connecting&hellip;</span>
    <button id="undo" title="Undo last message" disabled>&#x21b6;</button>
    <button id="new-session" title="New session" disabled>&#x21bb;</button>
  </header>
  <div id="log"></div>
  <div id="preview-strip"></div>
  <footer>
    <button id="attach" title="Attach image" disabled>&plus;</button>
    <input type="file" id="file-input" accept="image/*" multiple hidden />
    <input id="input" type="text" placeholder="Message Kazka&hellip;" disabled />
    <button id="send" disabled>Send</button>
  </footer>

  <div id="modal-overlay" class="hidden">
    <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">Start a new session?</h2>
      <p>This clears the current conversation.</p>
      <label class="toggle">
        <input type="checkbox" id="save-memories" checked />
        <span>Save memories first (sleep cycle)</span>
      </label>
      <p id="modal-hint" class="modal-hint"></p>
      <div class="modal-buttons">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-confirm">Start new session</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
